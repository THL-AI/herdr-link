# `herdr-link init` writes this for you. By hand: copy it to
# ~/.config/herdr-link/config.toml (or pass a path / set HERDR_LINK_CONFIG).
# Secrets go in ~/.config/herdr-link/.env, never here.

[adapters.discord]
command = ["herdr-link-discord"]   # argv of the adapter process
env = ["DISCORD_TOKEN"]              # env vars the adapter may see (besides PATH, HOME, ...)
# Everything else in this section is sent to the adapter in `hello`.
owner = "<discord user snowflake>"
guild = "<guild snowflake>"

[agents.claude]
template = "claude"
emoji = "✳️"
logo = "claude"        # application emoji name
allow = ["1"]          # verified on Claude Code 2.1.316: 1 = Yes
always = ["2"]         # 2 = Yes, and don't ask again (wording varies per prompt)
deny = ["esc"]         # esc = No; Claude then asks what to do instead

[agents.grok]
template = "grok"
emoji = "⚪"
logo = "grok"
allow = ["3"]          # verified on Grok Build 2026-11-02: 3 = Yes, proceed
always = ["2"]         # 2 = always allow this command (1 would turn on global always-approve)
deny = ["4"]           # 4 = No, reject; grok goes idle
trust = ["y"]          # "Do you trust this folder?" (y / n)

[agents.shell]
argv = ["zsh", "-l"]
emoji = "🐚"
